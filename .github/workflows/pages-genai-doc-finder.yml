name: Deploy GenAI Doc Finder to Pages

on:
  push:
    branches: [main]
    paths: ["GenAI/doc-finder/**", ".github/workflows/pages-genai-doc-finder.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the prototype
        run: |
          mkdir -p _site/genai-doc-finder
          cp -r GenAI/doc-finder/. _site/genai-doc-finder/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
